<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Candy Catcher</title>
    <link rel="shortcut icon" href="image/favicon-16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>

    <div id="score-board">
        <span>Candies Collected: <span id="score">0</span> - Left: <span id="remaining">12</span></span>
        <button id="music-btn" aria-label="Toggle Audio">🔇</button>
    </div>

    <audio id="bg-music" loop src="./sound/halloween.mp3"></audio>
    
    <div id="pumpkin">🎃</div>

    <div id="candies-container"></div>
    <div id="monsters-container"></div>

    <div id="game-over" style="display: none;">
        <div class="game-over-card">
            <h2>🎃 TRICK OR TREAT! 🎃</h2>
            <p>You gathered all the treats!</p>
            <button id="restart-btn">Play Again!</button>
        </div>
    </div>


</body>
</html>
